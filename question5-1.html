<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
body {
    background-color: #920000;
    background-image:
        linear-gradient(#b63434 4px, transparent 4px),
        linear-gradient(90deg, #b63434 4px, transparent 4px);
    background-size: 40px 40px;

    animation: gridMove 2s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 40px 40px;
    }
}

h1 {
    color: #fff;
    text-align: center;
    margin-top: 100px;
    font-size: 100px;
    -webkit-text-stroke: 4px black;
font-family: 'Pixelify Sans', sans-serif;
}

h1 {
    animation: float 2s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

p {
    color: #fff;
    text-align: center;
    font-size: 34px;
    margin-top: 100px;
    font-weight: bold;
    font-family: 'Pixelify Sans', sans-serif;
    -webkit-text-stroke: 2px black;
}

p {
    animation: float 1.5s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

  .btn {
    display: inline-block;
    border-radius: 20px;
    border: 5px solid #ff3d3d;
     padding: 30px 60px;
    background-color: #bd1414;
    margin: 50px;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
    display: block;
    width: fit-content;
    margin: 50px auto;
    font-size: 50px;
    font-family: 'Pixelify Sans', sans-serif;
    }

      .boxx {
    display: inline-block;
    border-radius: 20px;
    border: 5px solid #e23737;
     padding: 10px 20px;
    background-color: #a81414;
    margin: 50px;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
    display: block;
    width: fit-content;
    margin: 50px auto;
    }

    .btn:hover {
    background-color: #681414;
    color: #feb3b3;
    }

    a {
    text-decoration: none;
    text-align: center;
    color: #fff;
    font-size: 150px;
    margin-top: 100px;
     -webkit-text-stroke: 6px black;
    font-family: 'Pixelify Sans', sans-serif;
    }

    a {
    animation: float 2.5s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

@keyframes wiggle {
    0% {
        transform: rotate(-3deg);
    }
    50% {
        transform: rotate(3deg);
    }
    100% {
        transform: rotate(-3deg);
    }
}

p {
    animation: wiggle 1.5s ease-in-out infinite;
}


.help {
    font-size: 20px;
}

</style>

</head>
<body>

    <h1>PASSWORD</h1>

    <p>Kailan muna birthmonth ni sir louise?</p>
    <div class='help'>
    <p style="margin-top: 100px;">Write the full month</p>
    <p style="margin-top: 10px;">Ex: JANUARY, FEBRUARY, MARCH</p>
    </div>

    <div class="boxx">
<input type="text" id="textext" style="width: 300px; height: 40px;" placeholder="enter month here">
<button id="submitmonth" class="btn" >SUBMIT</button>
   </div>

   <audio id="themeSong" autoplay>
    <source src="lastquestion.mp3" type="audio/mpeg">
</audio>

    <script>
let month;

document.getElementById("submitmonth").onclick = function() {
   month = document.getElementById("textext").value;
   console.log(month);

    if (month === "DECEMBER" || month === "december" || month === "December") {
        alert("sure ka?");
        alert("tama ka!");
        window.location.href = "thankyou.html";
        }
    else {
        alert("sure ka?");
        alert("noob mali ka");
        alert("lagot ka kay sirrrrrrrrrrr");
        window.location.href = "question5-1.html";
        }
    }
</script>
    
</body>
</html>
