<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <style>
body {
    background-color: #9a0909;
    background-image:
        linear-gradient(#7e0909 4px, transparent 4px),
        linear-gradient(90deg, #7e0909 4px, transparent 4px);
    background-size: 40px 40px;

    animation: gridMove 2s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 40px 40px;
    }
}

h1{
    color: #fff;
    text-align: center;
    margin-top: 100px;
    font-size: 100px;
    -webkit-text-stroke: 4px black;
font-family: 'Pixelify Sans', sans-serif;
}

h1 {
    animation: float 2s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

p {
    color: #fff;
    text-align: center;
    font-size: 54px;
    font-weight: bold;
    font-family: 'Pixelify Sans', sans-serif;
    -webkit-text-stroke: 3px black;
}

p {
    animation: float 1.5s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

  .btn {
    display: inline-block;
    border-radius: 20px;
    border: 5px solid #ff3d3d;
     padding: 10px 20px;
    background-color: #bd1414;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    display: block;
    width: fit-content;
    margin-top: 40px;
    margin-left: auto;
    margin-right: auto;
    }

    .btn:hover {
    background-color: #681414;
    color: #feb3b3;
    }


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

#popup,
#popupwrong {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    justify-content: center;
    align-items: center;
}

.popup-box {
    background: #bd1414;
    border: 6px solid #ff3d3d;
    border-radius: 20px;

    width: 70%;
    max-width: 700px;
    padding: 40px;

    text-align: center;
    color: white;

    font-family: 'Pixelify Sans', sans-serif;
}

.popup-box h2 {
    font-size: 70px;
    margin: 10px;

    -webkit-text-stroke: 2px black;
}

.popup-box p {
    font-size: 25px;
}

.continue-btn {
    display: block;
    width: fit-content;
    margin: 40px auto 0;

    padding: 15px 30px;

    background: #920000;
    border: 4px solid #ff3d3d;
    border-radius: 15px;

    color: white;
    text-decoration: none;
    font-size: 30px;
}

.continue-btn:hover {
    background-color: #681414;
    color: #feb3b3;
    }

   a {
    text-decoration: none;
    text-align: center;
    color: #fff;
    font-size: 50px;
    margin-top: 100px;
     -webkit-text-stroke: 3px black;
    font-family: 'Pixelify Sans', sans-serif;
    }

    a {
    animation: float 2.5s ease-in-out infinite;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 70%;
    margin: 50px auto;
}

.answer {
    color: #fff;
    text-align: center;
    font-size: 150px;
    font-weight: bold;
    font-family: 'Pixelify Sans', sans-serif;
    -webkit-text-stroke: 4px black;
    margin: 0px;
}

.randomizer {
    display: none;
    text-align: center;
    margin: 50px auto;
    font-family: 'Pixelify Sans', sans-serif;
    color: white;
}

#randomButtons {
    text-align: center;
}

#randomButtons .btn {
    display: inline-block;
    margin: 10px;
}

.randomizer h1 {
    font-size: 90px;
    margin-top: 10px;
}

.randomizer p {
    font-size: 40px;
}
</style>

<body>

      <h1>QUESTION 3</h1>
      <p>What helped e-sports grow in popularity in the 1990s?</p>

      <div class="answers">

     <a class="btn" href="#" onclick="startRandomizer()">Word of Mouth</a>
        <a class="btn" href="#" onclick="startRandomizer()">Televisions</a>
      <a class="btn" href="#" onclick="startRandomizer()">Sir Louise</a>
      <a class="btn" href="#" onclick="startRandomizer()">Gaming Consoles</a>
      </div>


      <div id="randomizer" class="randomizer">
    <h1 id="randomTitle">RANDOM ANSWER.exe</h1>

      <h1 id="result">???</h1>

    <p id="randomText">haha jk you got pranked</p>

    <div id="randomButtons">
 <a href="#" class="btn" onclick="pickAnswer(); return false;">PICK</a>
    <a href="#" class="btn" onclick="startRolling(); return false;">REROLL</a>
    </div>
</div>


   
      <div id="popup">
    <div class="popup-box">
        <h2>CORRECT!</h2>
           <p style="color: #fff;  -webkit-text-stroke: 2px black;">Napapagod kanaba?</p>

  <a style=" font-size: 70px; -webkit-text-stroke: 2px black;" href="question4.html" class="continue-btn">CONTINUE</a>
    </div>
</div>


<div id="popupwrong">
    <div class="popup-box">
        <h2>WRONG!</h2>
        <p style="color: #fff;  -webkit-text-stroke: 2px black;">haha noob.</p>

        <a style=" font-size: 70px; -webkit-text-stroke: 2px black;" href="question3.html" class="continue-btn">BACK</a>
    </div>
</div>

</div>

<a style="font-size: 30px; -webkit-text-stroke: 1px black;" href="question4.html">skip</a>

<audio id="themeSong" autoplay>
    <source src="lobby.mp3" type="audio/mpeg">
</audio>

<script>

    let sound;

function correctAnswer() {
    sound.pause();
    sound.currentTime = 0;

       sound = new Audio("wowcorrect.mp3");
    sound.play();

    document.getElementById("popup").style.display = "flex";
}

function wrongAnswer() {
    sound.pause();
    sound.currentTime = 0;
    
       sound = new Audio("hahawrong.mp3");
    sound.play();

    document.getElementById("popupwrong").style.display = "flex";
}


const options = ["Word of Mouth", "Televisions", "Sir Louise", "Gaming Consoles"];

let selectedAnswer = "";

function startRandomizer() {
      const themeSong = document.getElementById("themeSong");
    themeSong.pause();
    themeSong.currentTime = 0;

     sound = new Audio("Loonboon.mp3")
     sound.loop = true;
    sound.play();

    document.querySelector(".answers").style.display = "none";

    document.getElementById("randomizer").style.display = "block";

    document.getElementById("randomTitle").textContent = "Slot Machine!";
    document.getElementById("randomText").textContent =
        "haha jk you got pranked";

    startRolling();
}

function startRolling() {

    const rollroll = new Audio("rollingfx.mp3");
    rollroll.play();

    const result = document.getElementById("result");
    const buttons = document.getElementById("randomButtons");

    buttons.style.display = "none";

    let count = 0;

    const rolling = setInterval(() => {
        const random =
            options[Math.floor(Math.random() * options.length)];

        result.textContent = random;

        count++;

        if (count >= 20) {
            clearInterval(rolling);

                rollroll.pause();
    rollroll.currentTime = 0;

            selectedAnswer =
                options[Math.floor(Math.random() * options.length)];

            result.textContent = selectedAnswer;

            document.getElementById("randomTitle").textContent =
                "You rolled...";

            document.getElementById("randomText").textContent =
                "Do you want to pick this answer or reroll?";

            buttons.style.display = "block";
        }
    }, 100);
}

function pickAnswer() {
    if (selectedAnswer === "Televisions") {
        correctAnswer();
    } else {
        wrongAnswer();
    }
}
</script>

    
</body>
</html>
