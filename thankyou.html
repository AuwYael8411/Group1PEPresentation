    <style>
body {
    background-color: #920000;
    background-image:
        linear-gradient(#b63434 4px, transparent 4px),
        linear-gradient(90deg, #b63434 4px, transparent 4px);
    background-size: 40px 40px;

    animation: gridMove 2s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 40px 40px;
    }
}

h1 {
    color: #fff;
    text-align: center;
    margin-top: 100px;
    font-size: 100px;
    -webkit-text-stroke: 4px black;
font-family: 'Pixelify Sans', sans-serif;
}

h1 {
    animation: float 2s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

p {
    color: #fff;
    text-align: center;
    font-size: 34px;
    margin-top: 100px;
    font-weight: bold;
    font-family: 'Pixelify Sans', sans-serif;
    -webkit-text-stroke: 2px black;
}

p {
    animation: float 1.5s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

  .btn {
    display: inline-block;
    border-radius: 20px;
    border: 5px solid #ff3d3d;
     padding: 10px 20px;
    background-color: #bd1414;
    margin: 50px;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    text-align: center;
    display: block;
    width: fit-content;
    margin: 50px auto;
    }

    .btn:hover {
    background-color: #681414;
    color: #feb3b3;
    }

    a {
    text-decoration: none;
    text-align: center;
    color: #fff;
    font-size: 150px;
    margin-top: 100px;
     -webkit-text-stroke: 6px black;
    font-family: 'Pixelify Sans', sans-serif;
    }

    a {
    animation: float 2.5s ease-in-out infinite;
}


@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

</style>

</head>
